<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByeXie's MC服务器 | 公告中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">ByeXie's Minecraft服务器</h1>
            <p class="server-info">公告中心</p>
            <div class="nav-bar">
                <a href="../index.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    返回首页
                </a>
                <a href="../about/index.html" class="nav-link">
                    <i class="fas fa-heart"></i>
                    支持服务器
                </a>
            </div>
        </header>
        
        <main class="main-content">
            <div>
                <h1 class="page-title">服务器公告</h1>
                <p class="page-subtitle">最新动态与通知</p>
            </div>
            
            <!-- 公告列表容器 -->
            <div id="notices-container" class="notices-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>正在加载公告...</p>
                </div>
            </div>
            
            <!-- 公告类型筛选 -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">全部公告</button>
                <button class="filter-btn" data-filter="通知">通知</button>
                <button class="filter-btn" data-filter="警告">警告</button>
                <button class="filter-btn" data-filter="节日庆祝">彩蛋</button>
            </div>
        </main>
        
        <footer>
            <p>© 2026 ByeXie's Minecraft服务器</p>
            <div class="footer-info">
                <div class="footer-item">
                    <i class="fas fa-user"></i>
                    <span>服主：ByeXie</span>
                </div>
                <div class="footer-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="current-date">正在加载日期...</span>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
