            opacity: 0;

            display: block;
            margin-top: 18px;
            opacity: 1;

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.08); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }

        .bounce-in {
            animation: bounceIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;

        @keyframes fadeInUp {

            ['analyzeBtn', 'username', 'resultSection', 'resultUsername', 'lengthResult', 'progressBar', 'evaluation'].map(id => document.getElementById(id));

        const specialUsernames = [
            "Twi", "twi", "twistar", "Twistar", "TwiStar",
            "暮星", "暮星Twi", "暮星TwiStar", "暮星twistar",
            "twistar_", "airer_", "airer"
        ];

        function isSpecialUsername(username) {
            return username === "TYK";
        }

        function isNegativeUsername(username) {
            return specialUsernames.includes(username);
        }

        // 基于用户名的哈希函数
        function hashUsername(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                const char = username.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return Math.abs(hash);
        }

        // 确定性长度生成：概率分布优化，短区间占比降低
        function getDeterministicLength(username) {
            if (isNegativeUsername(username)) return -1;
            if (isSpecialUsername(username)) return 10000;
            
            const hash = hashUsername(username);
            // 将哈希值映射到0-1之间
            const normalized = (hash % 10000) / 10000;
            
            // 概率分布：更符合真实情况，短区间较少
            if (normalized < 0.03) {
                // 3% 概率：-10 ~ 0
                return Math.floor((hash % 11)) - 10;
            } else if (normalized < 0.10) {
                // 7% 概率：1 ~ 10
                return Math.floor((hash % 10)) + 1;
            } else if (normalized < 0.25) {
                // 15% 概率：11 ~ 20
                return Math.floor((hash % 10)) + 11;
            } else if (normalized < 0.70) {
                // 45% 概率：21 ~ 40 (主流)
                return Math.floor((hash % 20)) + 21;
            } else if (normalized < 0.88) {
                // 18% 概率：41 ~ 60
                return Math.floor((hash % 20)) + 41;
            } else if (normalized < 0.96) {
                // 8% 概率：61 ~ 80
                return Math.floor((hash % 20)) + 61;
            } else {
                // 4% 概率：81 ~ 100
                return Math.floor((hash % 20)) + 81;
            }
        }

            return arr[Math.floor(Math.random() * arr.length)];
        }

            evaluation.classList.remove('fade-in-up', 'show-text');
            progressBar.classList.remove('animated-stripes');
            void lengthResult.offsetWidth;
            void evaluation.offsetWidth;
            void progressBar.offsetWidth;
        }

        analyzeBtn.addEventListener('click', () => {
            clickSound.play().catch(e => {});
            const username = usernameInput.value.trim();
            if (!username) return alert('信息不能为空');

            usernameInput.disabled = true;
            analyzeBtn.disabled = true;
            analyzeBtn.classList.add('btn-loading');
            analyzeBtn.innerHTML = '<div class="spinner"></div><span>分析中...</span>';

            setTimeout(() => {
                resetAnimations();
                
                resultSection.classList.add('show');
                resultUsername.textContent = username;

                const isSpecial = isSpecialUsername(username);
                const isNegative = isNegativeUsername(username);
                const len = getDeterministicLength(username);

                let unit = 'cm';
                let displayValue = len;
                let progressWidth;

                lengthResult.classList.remove('special-result', 'negative-result');
                progressBar.style.background = '';

                if (isNegative) {
                    unit = 'cm';
                    displayValue = -1;
                    progressWidth = 0;
                    lengthResult.classList.add('negative-result');
                    progressBar.style.background = '#9ca3af';
                } else if (isSpecial) {
                    unit = 'km';
                    displayValue = 10000;
                    progressWidth = 100;
                    lengthResult.classList.add('special-result');
                    progressBar.style.background = '#FF6B6B';
                } else {
                    progressWidth = ((len - (-10)) / 110) * 100;
                    progressWidth = Math.min(100, Math.max(0, progressWidth));
                    
                    let barColor;
                    if (len <= 20) barColor = '#10b981';
                    else if (len <= 40) barColor = '#4A89DC';
                    else if (len <= 60) barColor = '#8b5cf6';
                    else if (len <= 80) barColor = '#f59e0b';
                    else barColor = '#ef4444';
                    progressBar.style.background = barColor;
                }

                let evalText;
                if (isNegative) {
                    evalText = getRandomEval(evals.negative);
                } else if (isSpecial) {
                    evalText = getRandomEval(evals.special);

                    evalText = getRandomEval(evals.ml);
                } else if (len <= 60) {
                    evalText = getRandomEval(evals.m);
                } else if (len <= 80) {
                    evalText = getRandomEval(evals.g);
                } else {
                    evalText = getRandomEval(evals.e);
                }

                progressBar.style.width = `${progressWidth}%`;
                evaluation.textContent = evalText;

                lengthResult.classList.add('bounce-in');
                evaluation.classList.add('fade-in-up', 'show-text');
                progressBar.classList.add('animated-stripes');

                animateValue(lengthResult, 0, displayValue, 1500, unit);

                usernameInput.disabled = false;
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('btn-loading');
                analyzeBtn.innerHTML = '<span>重新检测</span>';
            }, 2000);
        });

        usernameInput.addEventListener('keypress', e => e.key === 'Enter' && analyzeBtn.click());

        function animateValue(el, start, end, duration, unit) {
            let startTime = null;
            const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const currentValue = Math.round(start + (end - start) * progress);
                el.textContent = `${currentValue}${unit}`;
                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            };
            requestAnimationFrame(step);
        }
    </script>
</body>
</html>
