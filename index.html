<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七中育才银杏校区 | 墨池生态模拟系统</title>
    <style>
        :root {
            --primary: #2d5a27;
            --secondary: #6ab04c;
            --danger: #eb4d4b;
            --warning: #f9ca24;
            --info: #4834d4;
            --bg: #f0f2f5;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        body {
            font-family: 'SF Pro Display', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0; padding: 40px 20px;
            color: #2c3e50;
            display: flex; justify-content: center;
        }

        .dashboard {
            max-width: 1000px; width: 100%;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2.2rem; color: var(--primary); letter-spacing: 1px; }
        .header p { color: #666; margin-top: 10px; }

        /* 鱼池 2D 模拟器 */
        #pond-view {
            width: 100%; height: 350px;
            background: radial-gradient(circle, #b2ebf2 0%, #4dd0e1 100%);
            border-radius: 40px;
            position: relative; overflow: hidden;
            border: 10px solid #8d6e63;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .algae-mask {
            position: absolute; width: 100%; height: 100%;
            background: #4caf50; opacity: 0.6;
            z-index: 1; pointer-events: none;
        }

        .organism {
            position: absolute; font-size: 35px; z-index: 2;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
            cursor: default;
        }

        /* 状态卡片 */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-bottom: 30px;
        }

        .stat-card {
            background: white; padding: 20px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .stat-card span { display: block; }
        .stat-label { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--primary); }

        /* 交互区 */
        .controls {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center; margin-bottom: 20px;
        }

        .chip {
            padding: 10px 20px; border-radius: 50px; border: 2px solid var(--primary);
            background: white; cursor: pointer; font-weight: 600; color: var(--primary);
        }

        .chip.active { background: var(--primary); color: white; }
        .chip.fixed { border-color: #ccc; color: #999; cursor: not-allowed; }

        .btn-optimal {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            color: white; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 20px rgba(39, 174, 96, 0.3);
            margin-bottom: 40px;
        }

        .btn-optimal:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(39, 174, 96, 0.4); }

        /* 分析表格 */
        .analysis-table {
            width: 100%; border-collapse: collapse; background: white;
            border-radius: 20px; overflow: hidden; font-size: 0.95rem;
        }

        th { background: #f8f9fa; padding: 15px; text-align: left; color: #555; }
        td { padding: 15px; border-top: 1px solid #f0f0f0; vertical-align: top; }

        .tag-pro { color: #27ae60; font-weight: bold; }
        .tag-con { color: #e74c3c; font-weight: bold; }
        .tag-sol { color: #2980b9; font-size: 0.85rem; background: #eef7ff; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>墨池夏季生态模拟系统</h1>
    </div>

    <div id="pond-view">
        <div id="algae-layer" class="algae-mask"></div>
        <div id="entities"></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">🌿 生态健康指数</span>
            <span id="score-val" class="stat-value">--</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">🫧 溶解氧 (mg/L)</span>
            <span id="o2-val" class="stat-value">--</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">🌡️ 预测水温</span>
            <span class="stat-value">29.5°C</span>
        </div>
    </div>

    <div class="controls">
        <div class="chip fixed">锦鲤</div>
        <div class="chip fixed">绿藻</div>
        <div id="btn-carp" class="chip" onclick="toggle('carp')">鲢鱼 (食藻者)</div>
        <div id="btn-lily" class="chip" onclick="toggle('lily')">睡莲 (竞争者)</div>
        <div id="btn-snail" class="chip" onclick="toggle('snail')">本土螺蛳</div>
        <div id="btn-cleaner" class="chip" onclick="toggle('cleaner')">异型鱼 (清道夫)</div>
    </div>

    <button class="btn-optimal" onclick="applyOptimal()">重置方案</button>

    <table class="analysis-table">
        <thead>
            <tr>
                <th>物种角色</th>
                <th>✅ 利端 (Benefits)</th>
                <th>⚠️ 弊端 (Drawbacks)</th>
                <th>🛠️ 弊端解决方法</th>
            </tr>
        </thead>
        <tbody id="analysis-body">
            <!-- 动态填充 -->
        </tbody>
    </table>
</div>

<script>
    const species = {
        carp: { name: '鲢鱼', icon: '🐠', pro: '高效滤食绿藻，净化水质', con: '生性易惊，可能跳出水面', sol: '保持水深，避免池边剧烈运动' },
        lily: { name: '睡莲', icon: '🪷', pro: '遮蔽阳光减少绿藻光合，吸收氮磷', con: '夏季生长过快会覆盖水面导致缺氧', sol: '人工定期修剪，覆盖率控制在1/3以内' },
        snail: { name: '本土螺蛳', icon: '🐚', pro: '清理池底残饵及青苔', con: '过度繁殖会消耗水中钙质', sol: '引入少量掠食性鱼类自然控制数量' },
        cleaner: { name: '清道夫', icon: '🐟', pro: '强力舔食池壁附着藻类', con: '会舔食锦鲤体表粘液引发感染；食卵', sol: '<b>不建议!</b> 若使用须确保食物充足或隔离' }
    };

    let active = { carp: false, lily: false, snail: false, cleaner: false };

    function toggle(key) {
        active[key] = !active[key];
        document.getElementById(`btn-${key}`).classList.toggle('active');
        refresh();
    }

    function applyOptimal() {
        active = { carp: true, lily: true, snail: true, cleaner: false };
        ['carp', 'lily', 'snail'].forEach(k => document.getElementById(`btn-${k}`).classList.add('active'));
        document.getElementById('btn-cleaner').classList.remove('active');
        refresh();
    }

    function refresh() {
        let score = 40;
        let o2 = 3.2;
        let algaeOp = 0.7;
        let html = '';

        // 默认基础
        html += `<tr><td>锦鲤/绿藻</td><td>校园景观核心</td><td>高温下绿藻暴发导致夜间缺氧</td><td><span class="tag-sol">引入生物防治</span></td></tr>`;

        // 逻辑计算
        if(active.carp) { score += 20; o2 += 1.8; algaeOp -= 0.3; }
        if(active.lily) { score += 20; o2 += 1.2; algaeOp -= 0.2; }
        if(active.snail) { score += 10; o2 += 0.2; algaeOp -= 0.05; }
        if(active.cleaner) { 
            score -= 30; o2 -= 0.5; algaeOp -= 0.1; 
        }

        // UI 更新
        document.getElementById('score-val').innerText = Math.min(100, score) + ' 分';
        document.getElementById('o2-val').innerText = o2.toFixed(1);
        document.getElementById('algae-layer').style.opacity = Math.max(0.1, algaeOp);
        
        // 渲染表格
        Object.keys(active).forEach(key => {
            if(active[key]) {
                const s = species[key];
                html += `<tr>
                    <td>${s.name}</td>
                    <td class="tag-pro">${s.pro}</td>
                    <td class="tag-con">${s.con}</td>
                    <td><span class="tag-sol">${s.sol}</span></td>
                </tr>`;
            }
        });
        document.getElementById('analysis-body').innerHTML = html;

        // 渲染图标
        const entities = document.getElementById('entities');
        entities.innerHTML = '';
        const draw = (icon, count) => {
            for(let i=0; i<count; i++){
                const span = document.createElement('span');
                span.className = 'organism';
                span.innerText = icon;
                span.style.left = Math.random() * 85 + 5 + '%';
                span.style.top = Math.random() * 70 + 15 + '%';
                entities.appendChild(span);
            }
        };
        draw('🐟', 3); // 锦鲤
        if(active.carp) draw('🐠', 2);
        if(active.lily) draw('🪷', 4);
        if(active.snail) draw('🐚', 6);
        if(active.cleaner) draw('🖤', 1);
    }

    refresh();
</script>

</body>
</html>
