<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持 ByeXie's MC服务器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 25px;
        }
        
        .back-to-home:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .donation-card {
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            text-align: center;
            position: relative;
        }
        
        .donation-header {
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .server-info {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .donation-title {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .donation-subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .commitment-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #3498db;
        }
        
        .commitment-text {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 600;
            line-height: 1.6;
        }
        
        .donation-method {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .method-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            background-color: #07c160;
            color: white;
        }
        
        .method-name {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .method-desc {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 500px;
        }
        
        .wechat-tip {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            max-width: 500px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .github-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            opacity: 0.7;
        }
        
        .github-link:hover {
            color: #333;
            opacity: 1;
            transform: translateY(-2px);
        }
        
        .github-icon {
            font-size: 1.5rem;
            color: #333;
        }
        
        footer {
            text-align: center;
            padding: 25px 0 0;
            margin-top: 35px;
            border-top: 1px solid #eaeaea;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .footer-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .donation-card {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            .donation-title {
                font-size: 1.5rem;
            }
            
            .donation-method {
                padding: 25px 15px;
            }
            
            .method-name {
                font-size: 1.3rem;
            }
            
            .github-link {
                position: static;
                margin-top: 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            返回首页
        </a>
        
        <div class="donation-card">
            <a href="https://github.com/mcbyexie/mcbyexie.github.io/tree/mcserver" 
               target="_blank" 
               class="github-link"
               title="查看项目源代码">
                <i class="fab fa-github github-icon"></i>
                <span>项目源码</span>
            </a>
            
            <div class="donation-header">
                <h1 class="logo">ByeXie's Minecraft服务器</h1>
                <p class="server-info"> Minecraft 服务器 | 自由建造！</p>
            </div>
            
            <h2 class="donation-title">
                支持服务器运营
            </h2>
            
            <p class="donation-subtitle">
                byexie.top
            </p>
            
            <div class="commitment-box">
                <p class="commitment-text">
                    您捐赠的每一分钱我都会花在服务器的运营与维护上。
                </p>
            </div>
            
            <div class="donation-method">
                <div class="method-icon">
                    <i class="fab fa-weixin"></i>
                </div>
                <h3 class="method-name">捐赠方式</h3>
                <p class="method-desc">
                    真求你们了我已经自费了13元了（很多对吗）
                </p>
                
                <div class="wechat-tip">
                    <i class="fas fa-question-circle"></i>
                    什么？你还没有我微信？
                </div>
                
                <div style="margin-top: 25px; padding: 15px 20px; background-color: #f8f9fa; border-radius: 10px; max-width: 500px;">
                    <p style="color: #2c3e50; font-weight: 600; margin-bottom: 8px;">
                        <i class="fas fa-info-circle"></i>
                        注意事项
                    </p>
                    <p style="color: #666; font-size: 0.9rem;">
                        • 捐赠是自愿行为<br>
                        • 所有捐赠将用于服务器运营<br>
                        • 感谢您对服务器的支持
                    </p>
                </div>
            </div>
            
            <footer>
                <p>© 2026 ByeXie's Minecraft服务器</p>
                <div class="footer-info">
                    <div class="footer-item">
                        <i class="fas fa-user"></i>
                        <span>服主：ByeXie</span>
                    </div>
                    <div class="footer-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>2026年2月7日</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 返回首页按钮动画
            const backButton = document.querySelector('.back-to-home');
            backButton.addEventListener('click', function(e) {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
            
            // GitHub链接动画
            const githubLink = document.querySelector('.github-link');
            githubLink.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
            
            // 承诺框强调效果
            const commitmentBox = document.querySelector('.commitment-box');
            setInterval(() => {
                commitmentBox.style.boxShadow = '0 0 0 2px rgba(52, 152, 219, 0.3)';
                setTimeout(() => {
                    commitmentBox.style.boxShadow = '';
                }, 800);
            }, 4000);
            
            // 捐赠方式提示框交互
            const wechatTip = document.querySelector('.wechat-tip');
            wechatTip.addEventListener('click', function() {
                this.style.backgroundColor = '#ffeaa7';
                setTimeout(() => {
                    this.style.backgroundColor = '#fff3cd';
                }, 300);
            });
        });
    </script>
</body>
</html>
