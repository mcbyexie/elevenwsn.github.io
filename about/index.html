<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持 ByeXie's MC服务器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 25px;
        }
        
        .back-to-home:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .donation-card {
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        
        .donation-header {
            margin-bottom: 30px;
            position: relative;
        }
        
        .avatar-container {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #eaeaea;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .avatar-container:hover {
            border-color: #3498db;
            transform: scale(1.05);
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .server-info {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .donation-title {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .donation-subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .commitment-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #3498db;
        }
        
        .commitment-text {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 600;
            line-height: 1.6;
        }
        
        .donation-method {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .method-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            background-color: #07c160;
            color: white;
        }
        
        .method-name {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .method-desc {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 500px;
        }
        
        .qr-placeholder {
            width: 180px;
            height: 180px;
            margin: 15px 0;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            background-color: #fdfdfd;
        }
        
        .wechat-tip {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            max-width: 500px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        footer {
            text-align: center;
            padding: 25px 0 0;
            margin-top: 35px;
            border-top: 1px solid #eaeaea;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .footer-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .donation-card {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            .donation-title {
                font-size: 1.5rem;
            }
            
            .avatar-container {
                width: 50px;
                height: 50px;
            }
            
            .donation-method {
                padding: 25px 15px;
            }
            
            .method-name {
                font-size: 1.3rem;
            }
            
            .qr-placeholder {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://www.byexie.top/" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            返回首页
        </a>
        
        <div class="donation-card">
            <div class="donation-header">
                <a href="https://i.imgs.ovh/2026/02/06/yEEYWg.jpeg" target="_blank" class="avatar-container">
                    <img src="https://i.imgs.ovh/2026/02/06/yEEYWg.jpeg" alt="服主头像" class="avatar">
                </a>
                <h1 class="logo">ByeXie's Minecraft服务器</h1>
                <p class="server-info">Fabric模组服务器 | 自由建造</p>
            </div>
            
            <h2 class="donation-title">
                支持服务器
            </h2>
            
            <p class="donation-subtitle">
                👿
            </p>
            
            <div class="commitment-box">
                <p class="commitment-text">
                    您捐赠的每一分钱都将花在服务器的运营与维护上。
                </p>
            </div>
            
            <div class="donation-method">
                <div class="method-icon">
                    <i class="fab fa-weixin"></i>
                </div>
                <h3 class="method-name"></h3>
                <p class="method-desc">
                    如果您想支持服务器运营，请联系服主。
                </p>
                
                <div class="qr-placeholder">
                    <i class="fas fa-qrcode" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
                    <span>六百六十六</span>
                </div>
                
                <div class="wechat-tip">
                    <i class="fas fa-question-circle"></i>
                    什么？你还没有服主微信？去交流群里看看吧！
                </div>
            </div>
            
            <footer>
                <p>© 2023-2026 ByeXie's Minecraft服务器</p>
                <div class="footer-info">
                    <div class="footer-item">
                        <i class="fas fa-user"></i>
                        <span>服主：ByeXie</span>
                    </div>
                    <div class="footer-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>2026年2月6日</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 头像点击效果
            const avatarContainer = document.querySelector('.avatar-container');
            avatarContainer.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
            
            // 返回首页按钮动画
            const backButton = document.querySelector('.back-to-home');
            backButton.addEventListener('click', function(e) {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
            
            // 承诺框强调效果
            const commitmentBox = document.querySelector('.commitment-box');
            setInterval(() => {
                commitmentBox.style.boxShadow = '0 0 0 2px rgba(52, 152, 219, 0.3)';
                setTimeout(() => {
                    commitmentBox.style.boxShadow = '';
                }, 800);
            }, 4000);
        });
    </script>
</body>
</html>
