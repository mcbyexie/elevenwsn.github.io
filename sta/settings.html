<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC服务器状态 - 设置</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #333; padding: 24px; max-width: 600px; margin: 0 auto; }
h2 { font-size: 28px; margin-bottom: 28px; color: #10b981; font-weight: 700; }
.section { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.section-title { font-size: 14px; color: #666; margin-bottom: 20px; font-weight: 600; letter-spacing: 2px; }
.field { margin-bottom: 20px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333; }
input[type="text"], input[type="number"], input[type="color"], input[type="range"] { width: 100%; padding: 12px 16px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; color: #333; font-size: 14px; outline: none; transition: border-color 0.2s; }
input[type="text"]:focus, input[type="number"]:focus, input[type="color"]:focus { border-color: #10b981; }
input[type="color"] { padding: 4px; height: 48px; }
input[type="range"] { height: 6px; -webkit-appearance: none; appearance: none; background: #e5e7eb; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #10b981; cursor: pointer; }
.help { font-size: 12px; color: #999; margin-top: 6px; }
.btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #10b981; color: #fff; }
.btn-primary:hover { background: #059669; }
.btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-group { display: flex; gap: 12px; margin-top: 24px; }
.bg-preview { width: 100%; height: 140px; border-radius: 12px; border: 2px dashed #e5e7eb; background: #f9fafb; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; margin-top: 10px; background-size: cover; background-position: center; position: relative; }
.bg-preview.has-image { border-style: solid; border-color: #d1fae5; }
.bg-preview.has-image::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.7); }
.bg-preview.has-image span { position: relative; z-index: 1; color: #10b981; }
.toast { position: fixed; top: 20px; right: 20px; padding: 14px 28px; border-radius: 10px; font-size: 14px; z-index: 9999; opacity: 0; transform: translateX(100%); transition: all 0.3s; }
.toast.show { opacity: 1; transform: translateX(0); }
.toast-success { background: #10b981; color: #fff; }
.toast-error { background: #ef4444; color: #fff; }
.opacity-row { display: flex; align-items: center; gap: 12px; }
.opacity-row input[type="range"] { flex: 1; }
.opacity-value { font-size: 14px; color: #666; min-width: 40px; text-align: center; }
</style>
</head>
<body>
<h2>模板设置</h2>

<!-- 采集器设置 -->
<div class="section">
  <div class="section-title">采集器设置</div>
  <div class="field">
    <label>采集器地址 (IP或域名)</label>
    <input type="text" id="host" placeholder="例如: 127.0.0.1">
    <div class="help">运行 server-monitor.js 的服务器地址</div>
  </div>
  <div class="field">
    <label>采集器端口</label>
    <input type="number" id="port" placeholder="11451">
    <div class="help">默认为 11451</div>
  </div>
</div>

<!-- 标题设置 -->
<div class="section">
  <div class="section-title">显示设置</div>
  <div class="field">
    <label>服务器名称</label>
    <input type="text" id="serverName" placeholder="留空则使用采集器返回的名称">
    <div class="help">自定义显示在标题处的服务器名称</div>
  </div>
  <div class="field">
    <label>标题颜色</label>
    <input type="color" id="titleColor" value="#10b981">
  </div>
</div>

<!-- 背景图片 -->
<div class="section">
  <div class="section-title">背景图片</div>
  <div class="field">
    <label>背景图片 URL</label>
    <input type="text" id="bgUrl" placeholder="输入图片 URL 或上传图片">
    <div class="help">支持 http/https URL 或 base64 图片</div>
  </div>
  <div class="field">
    <label>上传背景图片</label>
    <input type="file" id="bgUpload" accept="image/*" style="display: none;">
    <button class="btn btn-primary" onclick="document.getElementById('bgUpload').click()">选择图片文件</button>
    <div class="help">支持 JPG/PNG/GIF，最大 5MB</div>
  </div>
  <div class="field">
    <label>背景图片预览</label>
    <div id="bgPreview" class="bg-preview">点击上传或输入 URL 预览效果</div>
  </div>
  <div class="field">
    <label>背景图片可见度</label>
    <div class="opacity-row">
      <input type="range" id="bgOpacity" min="10" max="90" value="70">
      <span class="opacity-value" id="opacityValue">70%</span>
    </div>
    <div class="help">值越大背景图越清晰，值越小文字越清晰</div>
  </div>
  <button class="btn btn-danger" onclick="clearBackground()">清除背景图片</button>
</div>

<div class="btn-group">
  <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
</div>

<div id="toast" class="toast"></div>

<script>
// ===== 测试脚本是否能执行 =====
console.log('=== SETTINGS JS LOADED ===');
alert('JS loaded');

// ===== EasyBot SDK 封装 =====
function readOptions(key) {
  var settings = null;
  try {
    if (window.easybot && window.easybot.readOptions) {
      settings = window.easybot.readOptions(key);
    }
  } catch (e) {
    console.warn('[Settings] SDK读取失败:', e.message);
  }
  if (!settings) {
    try {
      var saved = localStorage.getItem(key);
      if (saved) settings = JSON.parse(saved);
    } catch (e) {}
  }
  return settings || null;
}

function writeOptions(key, value) {
  try {
    if (window.easybot && window.easybot.writeOptions) {
      window.easybot.writeOptions(key, value);
    }
  } catch (e) {
    console.warn('[Settings] SDK写入失败:', e.message);
  }
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

// 读取已保存设置
function loadSettings() {
  var settings = readOptions('server_status') || {};
  
  if (settings.collectorHost) {
    document.getElementById('host').value = settings.collectorHost;
  }
  
  if (settings.collectorPort) {
    document.getElementById('port').value = settings.collectorPort;
  }

  if (settings.serverName) {
    document.getElementById('serverName').value = settings.serverName;
  }
  if (settings.titleColor) {
    document.getElementById('titleColor').value = settings.titleColor;
  }
  if (settings.backgroundImage) {
    document.getElementById('bgUrl').value = settings.backgroundImage;
    var preview = document.getElementById('bgPreview');
    preview.style.backgroundImage = 'url(' + settings.backgroundImage + ')';
    preview.classList.add('has-image');
    preview.innerHTML = '<span>背景图片预览</span>';
  }
  if (settings.bgOpacity !== undefined) {
    var val = Math.round(settings.bgOpacity * 100);
    document.getElementById('bgOpacity').value = val;
    document.getElementById('opacityValue').textContent = val + '%';
  }
}

function showToast(message, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + (isError ? 'toast-error' : 'toast-success');
  setTimeout(function() {
    toast.classList.remove('show');
  }, 3000);
}

// 保存设置
function saveSettings() {
  try {
    var serverNameVal = document.getElementById('serverName').value.trim();
    var bgUrlVal = document.getElementById('bgUrl').value.trim();
    
    var settings = {
      collectorHost: document.getElementById('host').value.trim() || '127.0.0.1',
      collectorPort: document.getElementById('port').value.trim() || '11451',
      serverName: serverNameVal || undefined,
      titleColor: document.getElementById('titleColor').value,
      backgroundImage: bgUrlVal || undefined,
      bgOpacity: parseFloat(document.getElementById('bgOpacity').value) / 100
    };
    
    console.log('[Save] 准备保存的设置:', JSON.stringify(settings));
    
    writeOptions('server_status', settings);
    showToast('设置已保存');
    
    // 验证保存结果
    var saved = readOptions('server_status');
    console.log('[Save] 保存后验证:', JSON.stringify(saved));
    
  } catch (err) {
    showToast('保存失败: ' + err.message, true);
    console.error('[Save] 保存异常:', err);
  }
}

// 清除背景图片
function clearBackground() {
  document.getElementById('bgUrl').value = '';
  var preview = document.getElementById('bgPreview');
  preview.style.backgroundImage = '';
  preview.classList.remove('has-image');
  preview.innerHTML = '点击上传或输入 URL 预览效果';
}

// 上传图片
document.getElementById('bgUpload').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showToast('图片大小不能超过 5MB', true);
    return;
  }

  var reader = new FileReader();
  reader.onload = function(event) {
    var base64 = event.target.result;
    document.getElementById('bgUrl').value = base64;
    var preview = document.getElementById('bgPreview');
    preview.style.backgroundImage = 'url(' + base64 + ')';
    preview.classList.add('has-image');
    preview.innerHTML = '<span>背景图片预览</span>';
  };
  reader.readAsDataURL(file);
});

// 背景 URL 变化时预览
document.getElementById('bgUrl').addEventListener('input', function(e) {
  var url = e.target.value.trim();
  var preview = document.getElementById('bgPreview');
  if (url) {
    preview.style.backgroundImage = 'url(' + url + ')';
    preview.classList.add('has-image');
    preview.innerHTML = '<span>背景图片预览</span>';
  } else {
    preview.style.backgroundImage = '';
    preview.classList.remove('has-image');
    preview.innerHTML = '点击上传或输入 URL 预览效果';
  }
});

// 透明度变化
document.getElementById('bgOpacity').addEventListener('input', function(e) {
  document.getElementById('opacityValue').textContent = e.target.value + '%';
});

loadSettings();
</script>
</body>
</html>
